name: release

on:
  push:
    tags:
      - "v*"

# Declared per job rather than here: only the jobs that publish need more than
# to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install what the crate builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev clang
      - run: cargo test --locked

  deb:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [armhf, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Check the versions against the tag
        run: |
          tag=${GITHUB_REF_NAME#v}
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml version $version does not match tag $tag" >&2
            exit 1
          fi
          # The changelog ships verbatim, so an ungated one would describe a
          # different release than the package being built.
          changelog=$(sed -n '1s/^viewpie (\(.*\)-[^-]*).*/\1/p' debian/changelog)
          if [ "$changelog" != "$tag" ]; then
            echo "debian/changelog version $changelog does not match tag $tag" >&2
            exit 1
          fi
      - name: Build the package
        run: ./scripts/build-deb.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # The image is built by its own workflow, which rebuild.yml also calls to
  # rebuild the latest release on a newer base.
  image:
    needs: deb
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: [deb, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
