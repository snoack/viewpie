name: Build arm64 Package

on:
  push:
    # Triggers when you push to your feature branch
    branches: ["**"]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev clang

      - name: Build arm64 deb package
        run: ./scripts/build-deb.sh arm64

      - name: Upload arm64 deb as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewpie-arm64-deb
          path: dist/*.deb
          retention-days: 1