name: image

# Called rather than run: by release.yml with the packages its deb job just
# built, and by rebuild.yml with those of the latest release.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      # Take the packages from the release rather than from this run.
      from-release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The tag, not main, even for a rebuild: its Dockerfile and changelog
      # are the ones that go with the packages it installs.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # Takes the packages the deb job built rather than building its own: the
      # image installs the same file a Pi installs, and building it twice is
      # both slower and a chance for the two to differ. A rebuild takes them
      # from the release for the same reason.
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.from-release }}
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Download the release's packages
        if: inputs.from-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" -p '*.deb' -D dist
      # apt has to run as the target architecture to resolve the package's
      # dependencies, which is not something cross-compiling helps with.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Without these the action emits only "0.1.0": no "latest", and no
          # "0.1" to follow patch releases. flavor keeps latest off a
          # pre-release tag such as v0.2.0-rc1.
          #
          # value, because a rebuild runs on main rather than on the tag, and
          # has to land on the same tags as the release it rebuilds.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          flavor: |
            latest=auto
      # One line per architecture, so keep these in step with the deb job's
      # matrix in release.yml: an architecture added there and not here is
      # built and then left out of the manifest without complaint.
      - name: Name the package each architecture installs
        id: debs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          revision=$(sed -n "1s/^viewpie ($version-\([^)]*\)).*/\1/p" debian/changelog)
          echo "armhf=dist/viewpie_${version}-${revision}_armhf.deb" >> "$GITHUB_OUTPUT"
          echo "arm64=dist/viewpie_${version}-${revision}_arm64.deb" >> "$GITHUB_OUTPUT"
      # One build per architecture rather than a single multi-platform build:
      # each installs a different .deb, and build-args cannot vary by platform
      # within one build.
      #
      # No tags on either: each is pushed by digest alone, and a registry
      # refuses a tagged ref pushed that way ("can't push tagged ref ... by
      # digest"). Tagging is the join below, which is the only step that knows
      # about both architectures. Passing steps.meta.outputs.tags here instead
      # is what failed the first time this workflow ran, and the two settings
      # contradict each other rather than one overriding the other.
      #
      # No cache either, so a rebuild cannot reuse an apt layer from before
      # the fixes it is for.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7
          build-args: DEB=${{ steps.debs.outputs.armhf }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
        id: armhf
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: DEB=${{ steps.debs.outputs.arm64 }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
        id: arm64
      # The two builds pushed by digest; this is what gives them a tag, so
      # that pulling viewpie:0.1.0 on a Pi 3 and a Pi 5 each gets its own
      # architecture.
      #
      # One imagetools call per tag, and the tags arrive newline separated, so
      # the loop reads them a line at a time rather than letting the shell
      # split on spaces as well.
      - name: Join them under one tag
        run: |
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "ghcr.io/${{ github.repository }}@${{ steps.armhf.outputs.digest }}" \
              "ghcr.io/${{ github.repository }}@${{ steps.arm64.outputs.digest }}"
          done
